name: IqraLock
options:
  bundleIdPrefix: com.tahaarif.iqralock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    DEVELOPMENT_TEAM: "" # set on Mac in Xcode or via xcconfig
    CODE_SIGN_STYLE: Automatic

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  # RevenueCat / PostHog are optional until App Store accounts exist.
  # Uncomment on Mac when ready:
  # RevenueCat:
  #   url: https://github.com/RevenueCat/purchases-ios
  #   from: "5.0.0"
  # PostHog:
  #   url: https://github.com/PostHog/posthog-ios
  #   from: "3.0.0"

targets:
  IqraLockKit:
    type: framework
    platform: iOS
    sources:
      - path: IqraLockKit
    resources:
      - path: Resources/Quran
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      # Owned by the framework, not the app: OptionRow and the onboarding heroes live in
      # IqraLockKit, and the shield extensions link it too. Resolved via Bundle.iqraLockKit.
      - path: Resources/Icons.xcassets
      - path: Resources/LICENSE-fluent-emoji.txt
        buildPhase: resources
    dependencies:
      # The SDK ships this as libsqlite3.tbd; "SQLite3.tbd" does not exist and fails
      # at link time. The `-lsqlite3` in OTHER_LDFLAGS below is what actually links it.
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock.kit
        # Must stay NO wherever `info.path` is set below. With both, Xcode synthesises its own
        # Info.plist and the hand-written UIAppFonts array never reaches the bundle — silently,
        # because Font.custom falls back to the system face rather than erroring.
        GENERATE_INFOPLIST_FILE: "NO"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
    info:
      path: IqraLockKit/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf

  IqraLock:
    type: application
    platform: iOS
    sources:
      - path: IqraLock
    resources:
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: IqraLock/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: IqraLockKit
      - target: ShieldConfiguration
        embed: true
      - target: ShieldAction
        embed: true
      - target: DeviceActivityMonitor
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock
        # See the note on IqraLockKit — this target owns UIAppFonts, so the checked-in plist
        # must win. The INFOPLIST_KEY_* settings that used to live here only take effect when
        # the plist is generated; their values now live in `info.properties` below.
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: IqraLock/IqraLock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: IqraLock/Info.plist
      properties:
        CFBundleDisplayName: IqraLock
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Was INFOPLIST_KEY_UIApplicationSceneManifest_Generation. SwiftUI's App lifecycle needs
        # the key present but declares no scene configurations of its own.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
        NSFamilyControlsUsageDescription: IqraLock uses Screen Time to shield distracting apps until you finish your daily Qur'an reading.
        NSUserNotificationsUsageDescription: IqraLock sends reading reminders and unlock confirmations.
    entitlements:
      path: IqraLock/IqraLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tahaarif.iqralock.shared

  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfiguration
    dependencies:
      - target: IqraLockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock.ShieldConfiguration
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ShieldConfiguration/ShieldConfiguration.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: ShieldConfiguration
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    info:
      path: ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfiguration
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tahaarif.iqralock.shared

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
    dependencies:
      - target: IqraLockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock.ShieldAction
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: ShieldAction
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tahaarif.iqralock.shared

  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitor
    dependencies:
      - target: IqraLockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock.DeviceActivityMonitor
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: DeviceActivityMonitor
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    info:
      path: DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: DeviceActivityMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tahaarif.iqralock.shared

  IqraLockKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IqraLockKitTests
    dependencies:
      - target: IqraLockKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock.IqraLockKitTests
        GENERATE_INFOPLIST_FILE: YES

  IqraLockSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IqraLockSnapshotTests
    dependencies:
      - target: IqraLock
      - target: IqraLockKit
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaarif.iqralock.IqraLockSnapshotTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IqraLock.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IqraLock"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  IqraLock:
    build:
      targets:
        IqraLock: all
        IqraLockKit: all
        ShieldConfiguration: all
        ShieldAction: all
        DeviceActivityMonitor: all
    test:
      targets:
        - IqraLockKitTests
        - IqraLockSnapshotTests
    run:
      config: Debug
      storeKitConfiguration: Resources/StoreKit/IqraLock.storekit
