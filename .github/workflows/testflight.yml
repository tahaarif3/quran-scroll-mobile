name: TestFlight

# Builds a signed archive on a macOS runner and uploads it to TestFlight, so a
# physical device can be tested from a Windows machine with no Mac involved.
#
# Signing uses an App Store Connect API key plus `-allowProvisioningUpdates`, which
# lets Xcode create and download the distribution certificate and the four
# provisioning profiles itself. That matters here: exporting a .p12 by hand normally
# requires Keychain Access — i.e. a Mac. This path needs only a browser.
#
# Manual trigger by default. TestFlight processing takes 5-15 minutes per build and
# build numbers are consumed permanently, so uploading on every push wastes both.

on:
  workflow_dispatch:
    inputs:
      notify_testers:
        description: "Notify external testers when processing completes"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SCHEME: IqraLock
      ARCHIVE_PATH: build/IqraLock.xcarchive
      EXPORT_PATH: build/export

    steps:
      - uses: actions/checkout@v4

      # App Store Connect rejects anything built with an SDK older than iOS 26, so the runner's
      # default Xcode is not necessarily good enough — pick the newest installed and fail loudly
      # rather than discovering it 12 minutes later at the upload step.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "${NEWEST}/Contents/Developer"
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "iOS SDK major: ${SDK}"
          if [ "${SDK}" -lt 26 ]; then
            echo "::error::Need the iOS 26 SDK or later to upload; newest available is ${SDK}."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # CFBundleIconName is declared in project.yml under info.properties, yet three builds
      # reached App Store validation without it. Rather than guess again, print what actually
      # lands in the generated plist and then write the key directly, so its presence does not
      # depend on how XcodeGen or Xcode treat the properties block.
      - name: Force CFBundleIconName into the generated plist
        run: |
          set -euo pipefail
          PLIST=IqraLock/Info.plist
          echo "--- as generated ---"
          plutil -p "$PLIST" | grep -E "CFBundleIconName|UIDeviceFamily" || echo "(neither key present)"
          plutil -replace CFBundleIconName -string AppIcon "$PLIST"
          plutil -insert UIDeviceFamily -json '[1]' "$PLIST" 2>/dev/null \
            || plutil -replace UIDeviceFamily -json '[1]' "$PLIST"
          echo "--- after forcing ---"
          plutil -p "$PLIST" | grep -E "CFBundleIconName|UIDeviceFamily"

      # altool and xcodebuild both look for the key here by its KEY_ID.
      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_ID}" ] || [ -z "${PRIVATE_KEY}" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_PRIVATE_KEY are not set. See docs/CI_TESTFLIGHT_SETUP.md"
            exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "${PRIVATE_KEY}" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # Every TestFlight upload needs a build number higher than the last. github.run_number
      # increments monotonically, so this can never collide or regress.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project IqraLock.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${ARCHIVE_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyIssuerID "${ISSUER_ID}" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet

      # Resources went missing silently for a long time: a `resources:` block in project.yml is
      # not a key XcodeGen understands, so the fonts, the Qur'an database and both asset
      # catalogues were dropped without any warning, and the unit test that would have caught
      # the database is written to skip when it is absent. Fail here instead of at upload, or
      # worse, on a device.
      - name: Verify the archived bundle actually contains its resources
        run: |
          set -euo pipefail
          APP="${ARCHIVE_PATH}/Products/Applications/IqraLock.app"
          FW="$APP/Frameworks/IqraLockKit.framework"

          echo "--- app Info.plist ---"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIconName|UIDeviceFamily" || echo "(missing)"

          fail=0
          check() {  # description, path
            if [ -e "$2" ]; then echo "  ok   $1"; else echo "  MISS $1  ($2)"; fail=1; fi
          }
          echo "--- required payload ---"
          check "app icon catalogue"   "$APP/Assets.car"
          check "Qur'an database"      "$FW/quran.sqlite"
          check "Nunito-Black"         "$FW/Nunito-Black.ttf"
          check "Amiri-Bold"           "$FW/Amiri-Bold.ttf"
          check "Fluent icon assets"   "$FW/Assets.car"

          # UIAppFonts only registers fonts in the *app* bundle, and only when the plist names
          # match the layout — so print both, because a mismatch here is invisible until a font
          # comes back nil on device and UIKit aborts on the NSNull it gets handed.
          echo "--- fonts in app bundle ---"
          ls "$APP"/*.ttf 2>/dev/null | xargs -n1 basename 2>/dev/null || echo "  (none at bundle root)"
          ls "$APP/Fonts" 2>/dev/null || echo "  (no Fonts/ subdirectory)"
          echo "--- UIAppFonts declared ---"
          plutil -extract UIAppFonts json -o - "$APP/Info.plist" 2>/dev/null || echo "  (not declared)"

          if [ "$fail" -ne 0 ]; then
            echo "--- app bundle ---";       ls "$APP"
            echo "--- framework bundle ---"; ls "$FW" 2>/dev/null || echo "(no framework)"
            echo "::error::Resources are missing from the archive — check the sources/buildPhase entries in project.yml."
            exit 1
          fi

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          mkdir -p build
          # `app-store-connect` is the Xcode 15.3+ name for what used to be `app-store`.
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "${EXPORT_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyIssuerID "${ISSUER_ID}"
          ls -lh "${EXPORT_PATH}"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "${EXPORT_PATH}" -name '*.ipa' | head -1)
          if [ -z "${IPA}" ]; then
            echo "::error::No .ipa produced by export"
            exit 1
          fi
          echo "Uploading ${IPA} as build ${{ github.run_number }}"
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA}" \
            --apiKey "${KEY_ID}" \
            --apiIssuer "${ISSUER_ID}"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-failure-logs
          path: |
            build/ExportOptions.plist
            ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          {
            echo "### Uploaded to TestFlight"
            echo ""
            echo "Build number: **${{ github.run_number }}**"
            echo ""
            echo "Processing takes 5-15 minutes. It appears in TestFlight on your device once App Store Connect finishes."
          } >> "$GITHUB_STEP_SUMMARY"
