name: iOS Build & Test

# Runs the Mac-only toolchain on GitHub's macOS runners so the project can be
# validated from a Windows machine. Free for public repositories.
#
# What this CAN verify: the project generates, everything compiles, unit tests pass,
# and the app launches in a Simulator.
# What it CANNOT verify: anything behind FamilyControls / ManagedSettings / DeviceActivity.
# Those need a physical device — see docs/TESTFLIGHT_HUMAN_PLAN.md.

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/verify_font_names.py
      - run: python3 Scripts/validate_project.py

  build-and-test:
    needs: static-checks
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify font names
        run: python3 Scripts/verify_font_names.py

      - name: Validate project resources
        run: python3 Scripts/validate_project.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve a Simulator destination
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone 1[6-9][^(]*' \
            | head -1 \
            | sed 's/[[:space:]]*$//')
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator found. Available devices:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: |
          set -o pipefail
          xcodebuild build \
            -project IqraLock.xcodeproj \
            -scheme IqraLock \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Build extension targets
        run: |
          set -o pipefail
          for TARGET in ShieldConfiguration ShieldAction DeviceActivityMonitor; do
            echo "Building ${TARGET}…"
            xcodebuild build \
              -project IqraLock.xcodeproj \
              -target "${TARGET}" \
              -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              -quiet
          done

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project IqraLock.xcodeproj \
            -scheme IqraLock \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:IqraLockKitTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild-test.log
          # Extract pass/fail summary for the job summary
          if command -v xcrun >/dev/null && [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult \
              > test-summary.json 2>/dev/null || true
          fi

      - name: Print test summary
        if: always()
        run: |
          if [ -f test-summary.json ]; then
            echo "Test results:"
            cat test-summary.json
          fi
          grep -E "Test (Suite|Case).*passed|failed" xcodebuild-test.log | tail -40 || true

      - name: Run snapshot tests (non-blocking)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project IqraLock.xcodeproj \
            -scheme IqraLock \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:IqraLockSnapshotTests \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            TestResults.xcresult
            xcodebuild-test.log
            test-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: success()
        run: |
          {
            echo "### iOS build & tests passed"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Compile app + extensions | ✅ |"
            echo "| IqraLockKitTests (unit) | ✅ |"
            echo "| Snapshot tests | non-blocking |"
            echo ""
            echo "**Feature areas covered by unit tests:**"
            echo "- Progress sync & streak pipeline"
            echo "- Bathroom breaks (5 min / month)"
            echo "- Casual reading mode (no Screen Time)"
            echo "- Prayer time calculation"
            echo "- Parent PIN (Keychain)"
            echo "- Unlock coordinator & Screen Time factory"
            echo ""
            echo "Screen Time blocking, notifications, and Keychain UI still need **device TestFlight** verification."
          } >> "$GITHUB_STEP_SUMMARY"
